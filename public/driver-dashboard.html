<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JeepNi — Driver Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css">
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <link rel="stylesheet" href="css/driver-dashboard.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar border-bottom">
  <div class="container">
    <span class="navbar-brand fw-semibold">JeepNi — Driver Dashboard</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span id="driverInfo" class="small text-muted">Checking session…</span>
      <div class="ms-auto d-flex align-items-center gap-2">
          <a href="my-profile.html" class="btn btn-outline-secondary btn-sm">My Profile</a>
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </div>
</nav>

<main class="driver-shell">
  <div id="alerts"></div>
  <!-- Map Container -->
  <div class="map-container">
    <div id="map"></div>
  </div>

  <!-- Driver Control Panel -->
  <div class="driver-panel">
    <div class="driver-panel__inner">
      
      <!-- Assignment Info -->
      <div class="control-section">
        <div class="section-label">Today's Assignment</div>
        <div id="assignBox" class="assignment-display">Loading…</div>
      </div>

      <!-- Trip Controls -->
      <div class="control-section">
        <div class="section-label">Trip Status</div>
        <div class="trip-actions">
          <button id="btnAccept" class="action-btn action-btn--accept">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Accept</span>
          </button>
          <button id="btnEnroute" class="action-btn action-btn--start">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Start Trip</span>
          </button>
          <button id="btnComplete" class="action-btn action-btn--complete">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Complete</span>
          </button>
        </div>
      </div>

      <!-- Capacity Control -->
      <div class="control-section">
        <div class="section-label">Capacity</div>
        <div class="capacity-control">
          <span id="capBadge" class="capacity-badge capacity-badge--available">Available</span>
          <button id="btnToggleFull" class="capacity-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <span>Mark FULL</span>
          </button>
        </div>
      </div>

      <!-- Navigation -->
      <div class="control-section">
        <div class="section-label">Navigation</div>
        <select id="destinationSelect" class="destination-select">
          <option value="">Choose destination...</option>
          <option value="16.0754843,120.3546182">Saint Gabriel Parish</option>
          <option value="16.073742,120.351614">Alip, Boquig Waiting Shed</option>
          <option value="16.076286,120.3557308">Bonuan Boquig Barangay Hall</option>
          <option value="16.066106,120.353298">Sagor, Longos</option>
          <option value="16.070591,120.359635">Centro, Longos</option>
          <option value="16.044321,120.343607">SM Center Dagupan</option>
          <option value="16.043786,120.344272">DBP</option>
          <option value="16.042842,120.344109">Victory Bus Terminal</option>
        </select>
        <button id="btnNavigate" class="navigate-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
          <span>Start Navigation</span>
        </button>
      </div>

      <!-- Stop Tracking (shown when active) -->
      <button id="btnStopTracking" class="stop-tracking-btn d-none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <rect x="9" y="9" width="6" height="6"></rect>
        </svg>
        <span>Stop Sharing Location</span>
      </button>

    </div>
  </div>
</main>
<script type="module">
  /* Imports */
  import { requireRole, signOutAndRedirect, auth, db, ref, update, onValue, serverTimestamp, set } from "./js/authentication.js";
  import { query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
  import { startTrip } from "./js/create-trip.js";
  import { endTrip } from "./js/trip-tracking.js";
  import { myAssignments, setStatus } from "./js/scheduling.js";
  // Use tracker helpers to begin/stop sharing tied to trips
  import { beginSharing, stopSharing, isSharing, setMyFull } from "./js/map-tracker.js";

const alertBox = document.getElementById("alerts");
  function showAlert(msg, type = "warning") {
    alertBox.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;
  }

  window.addEventListener('jeepni:routing-notice', (evt) => {
    const detail = evt?.detail || {};
    const variant = detail.level === 'error' ? 'danger' : (detail.level === 'success' ? 'success' : 'warning');
    if (detail?.message) {
      showAlert(detail.message, variant);
    }
  });

  /* Auth */
  const { user } = await requireRole(['driver'], { onDeny: () => alert('Access denied. Drivers only.') });
  document.getElementById("driverInfo").textContent = user.email;

/* ===== ROUTING FOR DRIVERS ===== */
  const destinationSelect = document.getElementById('destinationSelect');
  const btnNavigate = document.getElementById('btnNavigate');
  const btnClearRoute = document.getElementById('btnClearRoute');
  let currentRouteTarget = null;

  // Enable navigate button when destination is selected
  if (destinationSelect && btnNavigate) {
    destinationSelect.addEventListener('change', () => {
      const hasSelection = destinationSelect.value !== '';
      btnNavigate.disabled = !hasSelection;
    });
  }

  // Start navigation to selected destination
  if (btnNavigate) {
    btnNavigate.addEventListener('click', () => {
      const coords = destinationSelect.value.split(',');
      if (coords.length !== 2) return;
      
      const lat = parseFloat(coords[0]);
      const lng = parseFloat(coords[1]);
      const name = destinationSelect.options[destinationSelect.selectedIndex].text;
      
      if (!isNaN(lat) && !isNaN(lng)) {
        try {
          // Set destination marker
          if (window.JeepNiTracker && window.JeepNiTracker.setDestination) {
            window.JeepNiTracker.setDestination(lat, lng, name);
          }
          
          // Start routing if sharing is active
          if (window.JeepNiTracker && window.JeepNiTracker.isSharing() && window.JeepNiTracker.routeTo) {
            window.JeepNiTracker.routeTo(lat, lng);
            currentRouteTarget = { lat, lng, name };
            showAlert(`Navigation started to ${name}`, 'success');
          } else {
            showAlert('Start your trip first (click "Start En-route")', 'warning');
          }
        } catch (err) {
          console.error('Navigation error:', err);
          showAlert('Failed to start navigation', 'danger');
        }
      }
    });
  }

  /* Button references */
  const btnAccept = document.getElementById('btnAccept');
  const btnEnroute = document.getElementById('btnEnroute');
  const btnComplete = document.getElementById('btnComplete');
  const btnStopTracking = document.getElementById('btnStopTracking');
  const capBadge = document.getElementById('capBadge');
  const btnToggleFull = document.getElementById('btnToggleFull');

  let fullState = false;
  let currentDispatch = null;
  let activeTripId = null;

  function updateActionButtons() {
    if (!btnAccept || !btnEnroute || !btnComplete) return;
    const statusRaw = currentDispatch?.status || null;
    const status = typeof statusRaw === 'string' ? statusRaw.toLowerCase() : null;
    const hasDispatch = Boolean(currentDispatch && currentDispatch.id && currentDispatch.date);
    btnAccept.disabled = !hasDispatch || !['pending', 'assigned'].includes(status);
    btnEnroute.disabled = !hasDispatch || !['accepted', 'assigned'].includes(status);
    btnComplete.disabled = !hasDispatch || status !== 'enroute';
  }

  async function handleStatusChange(nextStatus) {
    if (!currentDispatch) {
      showAlert('No active assignment found.', 'warning');
      return;
    }

    const dispatchId = currentDispatch.id || currentDispatch.dispatch_id || null;
    const assignmentDate = currentDispatch.date || new Date().toISOString().slice(0, 10);
    const route = currentDispatch.route;
    if (!dispatchId || !assignmentDate) {
      showAlert('Assignment reference is incomplete. Please refresh.', 'danger');
      return;
    }

    try {
      await setStatus({ date: assignmentDate, dispatchId, status: nextStatus });

      await update(ref(db, `drivers/${user.uid}`), {
        status: nextStatus,
        last_status_update: serverTimestamp()
      });

      if (nextStatus === 'enroute') {
        if (!isSharing()) {
          const tripId = await startTrip(route || '', null, null, {
            assignment_id: dispatchId,
            date: assignmentDate,
            jeepney_type: currentDispatch.jeepney_type || currentDispatch.jeep || null,
            notes: currentDispatch.notes || ''
          });
          activeTripId = tripId;
          await beginSharing(tripId, route);
          window.JeepNiTracker?.setActiveTripId?.(tripId);
        }
        btnStopTracking.classList.remove('d-none');
        showAlert('Trip started and location sharing enabled.', 'success');
      } else if (nextStatus === 'completed') {
        try {
          await endTrip({ tripId: activeTripId || null, completed: true });
        } catch (endErr) {
          console.warn('Trip completion sync failed:', endErr);
        }
        await stopSharing();
        activeTripId = null;
        btnStopTracking.classList.add('d-none');
        fullState = false;
        renderCapUI();
        showAlert('Trip marked as completed.', 'success');
      } else if (nextStatus === 'accepted') {
        showAlert('Assignment accepted. Start the trip when you are ready.', 'success');
      } else {
        showAlert(`Status updated to ${nextStatus}.`, 'success');
      }

      currentDispatch.status = nextStatus;
    } catch (err) {
      console.error('Failed to change status:', err);
      showAlert('Failed to change status: ' + err.message, 'danger');
    } finally {
      await loadMyAssignment();
    }
  }

  /* Wire buttons */
  const btnLogout = document.getElementById("btnLogout");  if (btnLogout) {
      btnLogout.addEventListener("click", async () => {
          try {
              await signOutAndRedirect("login.html");
          } catch (error) {
              console.error('Logout failed:', error);
              showAlert('Failed to logout: ' + error.message, 'danger');
          }
      });
  }

  if (btnAccept) {
    btnAccept.addEventListener('click', () => handleStatusChange('accepted'));
  }

  if (btnEnroute) {
    btnEnroute.addEventListener('click', () => handleStatusChange('enroute'));
  }

  if (btnComplete) {
    btnComplete.addEventListener('click', () => handleStatusChange('completed'));
  }

  if (btnStopTracking) {
    btnStopTracking.addEventListener('click', () => handleStatusChange('completed'));
  }
  updateActionButtons();

  /* Capacity FULL toggle (near map) */

  function renderCapUI() {
    if (!capBadge || !btnToggleFull) return;
    if (fullState) {
      capBadge.className = 'capacity-badge capacity-badge--full';  // Uses new CSS classes
      capBadge.textContent = 'FULL';
      btnToggleFull.className = 'capacity-btn capacity-btn--active';  // Solid red background
      btnToggleFull.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
        <span>Set Available</span>
      `;  // Icon + text (matches new design)
    } else {
      capBadge.className = 'capacity-badge capacity-badge--available';
      capBadge.textContent = 'Available';
      btnToggleFull.className = 'capacity-btn';  // Outlined style
      btnToggleFull.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>Mark FULL</span>
      `;
    }
  }
  renderCapUI();

    onValue(ref(db, `drivers_location/${user.uid}`), (snap) => {
      const v = snap.exists() ? snap.val() : {};
      const newFullState = !!v.full;
      
      // Only update if state actually changed to prevent infinite loop
      if (newFullState !== fullState) {
        fullState = newFullState;
        renderCapUI();
      }
      
      // Always sync marker badge with database state (if marker exists)
      try { 
        if (window.JeepNiTracker?.setMyFull) {
          window.JeepNiTracker.setMyFull(fullState); 
        }
      } catch (e) {
        console.warn('Failed to sync FULL badge:', e);
      }
    });

  btnToggleFull.addEventListener('click', async () => {
    try {
      const newState = !fullState;
      fullState = newState;
      renderCapUI();
      
      // Don't call setMyFull here - just update database
      // The onValue listener will handle syncing the marker
      await update(ref(db, `drivers_location/${user.uid}`), { 
        full: fullState, 
        last_update: serverTimestamp() 
      });
      
      showAlert(fullState ? 'You are now marked FULL.' : 'You are now Available.', 'success');
    } catch (e) {
      showAlert('Failed to update capacity: ' + e.message, 'danger');
    }
  });

  /* Dispatch (assignments) */
  const assignBox = document.getElementById("assignBox");

  async function loadMyAssignment() {
    try {
      if (!assignBox) return;

      assignBox.innerHTML = "Loading...";

      const today = new Date().toISOString().slice(0, 10);
      const mine = await myAssignments(today);

      if (!mine || mine.length === 0) {
        currentDispatch = null;
        assignBox.innerHTML = "No assignment for today.";
        updateActionButtons();
        return;
      }

      currentDispatch = { ...mine[0] };
      currentDispatch.id = currentDispatch.id || currentDispatch.dispatch_id || null;
      currentDispatch.date = currentDispatch.date || today;

      assignBox.innerHTML = `
        Time: <strong>${currentDispatch.dep_time || "Not set"}</strong><br>
        Route: <strong>${currentDispatch.route || "Not set"}</strong><br>
        Jeep: <strong>${currentDispatch.jeep_id || "Not set"}</strong><br>
        Status: <strong>${currentDispatch.status || "Not set"}</strong>
      `;

      updateActionButtons();
    } catch (error) {
      console.error('Failed to load assignment:', error);
      assignBox.innerHTML = `<span class="text-danger">Error loading assignment: ${error.message}</span>`;
      showAlert('Failed to load assignment: ' + error.message, 'danger');
    }
  }

  await loadMyAssignment();
  
// ---- AUTO-RESUME TRACKING ON PAGE LOAD (OPT-IN) ----
  (async function autoResumeOnLoad() {
    try {
      // Wait for tracker and map to be fully ready
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      if (window.JeepNiTracker && window.JeepNiTracker.getTrackingState) {
        const state = await window.JeepNiTracker.getTrackingState();
        
        if (state && state.active && state.role === 'driver') {
          // Ask user if they want to resume
          const resume = confirm(
            'You have an active trip from your last visit.\n\n' +
            `Route: ${state.route || 'N/A'}\n` +
            `Trip ID: ${state.tripId || 'N/A'}\n\n` +
            'Would you like to resume tracking?'
          );
          
          if (resume) {
            // Resume tracking
            const resumed = await window.JeepNiTracker.autoResumeTracking();
            if (resumed) {
              console.log('Driver tracking auto-resumed successfully');
              
              // Show the stop tracking button
              btnStopTracking.classList.remove('d-none');
              activeTripId = state.tripId || window.JeepNiTracker?.getActiveTripId?.() || activeTripId;
              
              // Update capacity badge and button states
              if (capBadge) {
                capBadge.className = 'capacity-badge capacity-badge--available';
                capBadge.textContent = 'Tracking Active';
              }
              
              // Update assignment display
              await loadMyAssignment();
              updateActionButtons();
              
              showAlert('Location sharing resumed - tracking active', 'success');
            }
          } else {
            // User declined - clear the tracking state
            console.log('User declined to resume tracking');
            localStorage.removeItem('tracking_state');
            const u = auth.currentUser;
            if (u) {
              await set(ref(db, `active_tracking/${u.uid}`), null);
              await update(ref(db, `drivers_location/${u.uid}`), {
                online: false,
                last_update: Date.now()
              });
            }
          }
        }
      }
    } catch (err) {
      console.warn('Auto-resume check failed:', err);
    }
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

  (function(){
    const em = String.fromCharCode(8212);
    try {
      document.title = `JeepNi ${em} Driver Dashboard`;
      const brand = document.querySelector('.navbar .navbar-brand');
      if (brand) brand.textContent = `JeepNi ${em} Driver Dashboard`;
    } catch (_) {}
  })();
</script>
<script type="module">
  import './js/map-tracker.js';
</script>
</body>
</html>
