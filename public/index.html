<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JeepNi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#22d3ee" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#22d3ee; --accent:#ffd64a; --text:#0f172a; --muted:#6b7280;
    }
    
    /* Prevent scrolling and overflow */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* This prevents scrolling */
    }
    
    body{
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      color: var(--text);
      background: url('icons/Background1.png') no-repeat center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: left;
    }

    .landing{
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; 
      padding: min(5em, 8%);
      padding-top: 10vh;
      box-sizing: border-box;
      position: relative;
    }
    
    .logo{
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }
    
    .logo img{
      height: 150px;
      width: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.15));
    }
    
    .text-center{
      width: 100%;
      max-width: 800px;
      text-align: center;
    }
    
    .heading-img{
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 0 auto;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.3));
    }
    
    .tagline-img{
      width: 100%;
      max-width: 500px;
      height: auto;
      margin: 5px auto 0;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.25));
    }

    .cta-fixed-wrapper{
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 100%;
      text-align: center; 
    }
    
    .cta{
      margin-top: 50px;
    }
    
    .btn-tara-na-img{
      max-width: min(150px, 50vw);
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.3));
      transition: all 0.3s ease;
    }
    
    .btn-tara-na-img:hover {
      transform: translateY(-3px);
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.35));
    }
    
    .btn-tara-na-img:active {
      transform: translateY(-1px);
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.3));
    }
    .loader{
      width: min(460px, 92vw);
      margin: 24px auto 8px;
      display: none;
    }
    
    .bar{
      height: 18px;
      border-radius: 999px;
      background: #585c63;
      position: relative;
      padding: min(5em, 8%);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.25);
    }
    
    .fill{
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22d3ee, #0ea5b2);
    }
    
    .label{
      margin-top: 6px;
      text-align: center;
      color: #2d3748;
      font-weight: 600;
    }

    .foot{
      height: 10vh; 
    }
    
    @media (max-width: 768px){
      .logo img{
        height: 90px;
      }
      
      .heading-img{
        max-width: 500px;
      }
      
      .tagline-img{
        max-width: 400px;
      }
      
      .btn-tara-na-img{
        max-width: 180px;
      }
    }
    
    @media (max-width: 430px){
      body{
        /* Ensure the new background covers the screen on mobile */
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: left;
      }
      
      .logo img{
        height: 80px;
      }
      
      .heading-img{
        max-width: 90%;
      }
      
      .tagline-img{
        max-width: 85%;
      }
      
      .btn-tara-na-img{
        max-width: 160px;
      }
    }

  </style>
  <link rel="icon" href="/icons/JEEPNi.png" type="image/png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/JEEPNi.png">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light only">
  <meta name="description" content="Know before you go – Connect to a smarter commuting experience.">
</head>
<body>
<main class="landing">
    <div class="logo">
      <img src="icons/JEEPNi.png" alt="JeepNi logo" onerror="this.style.display='none'">
    </div>
    <div class="text-center">
      <img src="icons/Knowbefore you go.png" alt="Know before you go" class="heading-img" onerror="this.style.display='none'">
      <img src="icons/Connect to.png" alt="Connect to a smarter commuting experience" class="tagline-img" onerror="this.style.display='none'">
    </div>
    <div class="cta">
        <a href="login.html">
          <img src="icons/LoginButton.png" alt="Tara Na" class="btn-tara-na-img" onerror="this.style.display='none'">
        </a>
      </div>
    <div class="foot"></div>
  </main>

 <script type="module">
    // Add cache-busting and proper redirection
    const taraNaBtn = document.querySelector('.btn-tara-na-img');
    if(taraNaBtn){
      taraNaBtn.addEventListener('click', () => {
        // Clear any stored credentials
        localStorage.clear();
        sessionStorage.clear();
        
        // Add timestamp to prevent caching
        const nocache = new Date().getTime();
        window.location.href = `login.html?nocache=${nocache}`;
      });
      taraNaBtn.style.cursor = 'pointer';
    }
  </script>
</body>
</html>
